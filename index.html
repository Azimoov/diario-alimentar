<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Highlander — diário alimentar, exames e métricas</title>
  <meta name="description" content="Highlander: hub de saúde local-first — diário alimentar (base TACO), exames laboratoriais e de imagem com lembretes, e métricas do app Saúde do iPhone." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#2f7d55" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- ?v=N: mesma versão em todos os assets locais (CSS e JS). Suba o número a
       cada publicação que mexa em JS/CSS — sem isso o iPhone continua rodando o
       arquivo antigo do cache. Ver README, "Versão dos assets". -->
  <link rel="stylesheet" href="app.css?v=6" />
</head>
<body class="gate-active">
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-brand"><img src="icons/icon.svg" alt="" width="32" height="32" />Highlander</div>
      <p class="hint">Carregando…</p>
    </div>
  </div>
  <header class="topbar">
    <div class="brand">
      <img class="brand-icon" src="icons/icon.svg" alt="" width="22" height="22" />Highlander
      <button id="conta-chip" class="conta-chip" hidden></button>
    </div>
    <nav class="apps">
      <button class="app-btn active" data-app="diario"><span class="ico">🍽️</span>Diário</button>
      <button class="app-btn" data-app="exames"><span class="ico">🧪</span>Exames<span class="dot" hidden></span></button>
      <button class="app-btn" data-app="saude"><span class="ico">❤️</span>Métricas</button>
      <button class="app-btn" data-app="remedios"><span class="ico">💊</span>Remédios</button>
      <button class="app-btn" data-app="treino"><span class="ico">🏋️</span>Treino</button>
      <button class="app-btn" data-app="ia"><span class="ico">💬</span>IA</button>
    </nav>
    <nav class="tabs" data-app="diario">
      <button class="tab-btn active" data-tab="hoje">Hoje</button>
      <button class="tab-btn" data-tab="hist">Histórico</button>
      <button class="tab-btn" data-tab="alimentos">Alimentos</button>
      <button class="tab-btn" data-tab="perfil">Perfil</button>
      <button class="tab-btn" data-tab="dados">Dados</button>
    </nav>
    <nav class="tabs" data-app="exames" hidden>
      <button class="tab-btn" data-tab="exlab">🧪 Laboratoriais</button>
      <button class="tab-btn" data-tab="eximg">🩻 Imagem</button>
    </nav>
    <nav class="tabs" data-app="treino" hidden>
      <button class="tab-btn" data-tab="trsemana">📋 Semana</button>
      <button class="tab-btn" data-tab="trevolucao">📈 Evolução</button>
    </nav>
    <nav class="tabs" data-app="ia" hidden>
      <button class="tab-btn" data-tab="conversa">💬 Conversa</button>
      <button class="tab-btn" data-tab="analises">📄 Análises</button>
    </nav>
  </header>

  <main>
    <section id="tab-hoje" class="tab active"></section>
    <section id="tab-hist" class="tab"></section>
    <section id="tab-alimentos" class="tab"></section>
    <section id="tab-perfil" class="tab"></section>
    <section id="tab-dados" class="tab"></section>
    <section id="tab-remedios" class="tab"></section>
    <section id="tab-exlab" class="tab"></section>
    <section id="tab-eximg" class="tab"></section>
    <section id="tab-saude" class="tab"></section>
    <section id="tab-trsemana" class="tab"></section>
    <section id="tab-trevolucao" class="tab"></section>
    <section id="tab-conversa" class="tab"></section>
    <section id="tab-analises" class="tab"></section>
  </main>

  <footer class="foot">
    Dados privados por conta · Base TACO 4ª ed. (NEPA/UNICAMP) · IA opcional via seu proxy
  </footer>

  <!-- ordem importa: base -> medidas -> parser -> cálculo -> storage -> charts -> health -> app -->
  <script src="js/db.js?v=6"></script>
  <script src="js/measures.js?v=6"></script>
  <script src="js/parser.js?v=6"></script>
  <script src="js/nutrition.js?v=6"></script>
  <script src="js/storage.js?v=6"></script>
  <script src="js/charts.js?v=6"></script>
  <script src="js/health.js?v=6"></script>
  <script src="js/auth.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
