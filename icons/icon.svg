<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Highlander — quatro rostos surgindo do escuro em losango, iluminados de
       cima. Arte PRÓPRIA em homenagem à composição clássica do Queen; a
       fotografia original (Mick Rock) tem direitos autorais e não é usada. -->
  <defs>
    <radialGradient id="amb" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#1b1411"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e3cd"/>
      <stop offset="0.34" stop-color="#d9bd9a"/>
      <stop offset="0.66" stop-color="#8a6c51"/>
      <stop offset="0.88" stop-color="#3a2a1d"/>
      <stop offset="1" stop-color="#0d0906"/>
    </linearGradient>
    <linearGradient id="armg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d4bb"/>
      <stop offset="0.7" stop-color="#8d7159"/>
      <stop offset="1" stop-color="#120d09"/>
    </linearGradient>
    <filter id="blur6" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur3" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur10" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="10"/></filter>

    <!-- rosto genérico: origem no centro da cabeça, altura ~104 -->
    <g id="head">
      <!-- crânio + queixo -->
      <path fill="url(#skin)" d="M0,-52 C22,-52 38,-36 38,-10 C38,16 24,52 0,52 C-24,52 -38,16 -38,-10 C-38,-36 -22,-52 0,-52 Z"/>
      <!-- sombra pesada de um lado: luz dura vindo de cima -->
      <path fill="#120c07" opacity="0.55" filter="url(#blur6)" d="M-38,-12 C-38,16 -24,52 0,52 C-12,42 -20,18 -20,-10 C-20,-32 -12,-46 0,-50 C-22,-50 -38,-36 -38,-12 Z"/>
      <!-- órbitas fundas (o olhar some na sombra, como no original) -->
      <ellipse cx="-13" cy="-9" rx="11" ry="7" fill="#20150e" opacity="0.85" filter="url(#blur3)"/>
      <ellipse cx="13" cy="-9" rx="11" ry="7" fill="#20150e" opacity="0.85" filter="url(#blur3)"/>
      <ellipse cx="-13" cy="-9" rx="5.4" ry="2.8" fill="#0a0605"/>
      <ellipse cx="13" cy="-9" rx="5.4" ry="2.8" fill="#0a0605"/>
      <!-- sobrancelhas marcadas -->
      <path fill="#170f09" opacity="0.9" d="M-24,-18 C-18,-23 -8,-22 -3,-18 C-10,-19 -18,-18 -24,-14 Z"/>
      <path fill="#170f09" opacity="0.9" d="M24,-18 C18,-23 8,-22 3,-18 C10,-19 18,-18 24,-14 Z"/>
      <!-- nariz: lateral na sombra + ponta iluminada -->
      <path fill="#4a3323" opacity="0.6" filter="url(#blur3)" d="M-4,-6 C-7,4 -8,13 -5,17 L1,17 C-1,10 -1,2 1,-6 Z"/>
      <ellipse cx="1" cy="16" rx="5" ry="2.6" fill="#f6e8d3" opacity="0.6" filter="url(#blur3)"/>
      <!-- boca séria, quase reta -->
      <path fill="none" stroke="#2c1c11" stroke-width="2.4" stroke-linecap="round" opacity="0.8" d="M-9,31 C-3,32.5 3,32.5 9,31"/>
      <!-- luz dura na testa e no alto das maçãs -->
      <ellipse cx="0" cy="-34" rx="19" ry="9" fill="#fff8ec" opacity="0.42" filter="url(#blur6)"/>
      <ellipse cx="10" cy="8" rx="9" ry="6" fill="#fdf1de" opacity="0.22" filter="url(#blur6)"/>
      <!-- queixo/pescoço mergulham no preto -->
      <ellipse cx="0" cy="54" rx="30" ry="16" fill="#000" opacity="0.8" filter="url(#blur6)"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="url(#amb)"/>

  <!-- ===== figura de cima: cabelo longo, repartido ao meio ===== -->
  <g transform="translate(256 116)">
    <path fill="#0a0705" d="M0,-62 C36,-62 52,-36 50,-2 C48,26 44,44 40,60 C34,34 36,4 28,-14 C18,-32 -18,-32 -28,-14 C-36,4 -34,34 -40,60 C-44,44 -48,26 -50,-2 C-52,-36 -36,-62 0,-62 Z"/>
    <use href="#head"/>
    <path fill="#0a0705" d="M-38,-30 C-30,-52 -12,-58 0,-56 C12,-58 30,-52 38,-30 C24,-44 12,-46 0,-44 C-12,-46 -24,-44 -38,-30 Z"/>
  </g>

  <!-- ===== figura da esquerda: cabelo mais volumoso ===== -->
  <g transform="translate(146 238) rotate(-7) scale(0.94)">
    <path fill="#0a0705" d="M0,-64 C40,-64 56,-34 52,4 C50,30 46,48 42,62 C38,30 40,0 30,-16 C20,-32 -20,-32 -30,-16 C-40,0 -38,30 -42,62 C-46,48 -50,30 -52,4 C-56,-34 -40,-64 0,-64 Z"/>
    <use href="#head"/>
    <path fill="#0a0705" d="M-40,-26 C-34,-50 -14,-58 0,-56 C14,-58 34,-50 40,-26 C22,-42 -22,-42 -40,-26 Z"/>
  </g>

  <!-- ===== figura da direita: cabelo liso, franja lateral ===== -->
  <g transform="translate(366 238) rotate(7) scale(0.94)">
    <path fill="#0a0705" d="M0,-62 C38,-62 54,-34 50,2 C48,28 44,46 40,60 C36,28 38,-2 28,-16 C18,-30 -18,-30 -28,-16 C-38,-2 -36,28 -40,60 C-44,46 -48,28 -50,2 C-54,-34 -38,-62 0,-62 Z"/>
    <use href="#head"/>
    <path fill="#0a0705" d="M-38,-28 C-30,-52 -8,-58 6,-54 C20,-50 32,-40 38,-26 C26,-40 6,-46 -8,-42 C-20,-38 -30,-34 -38,-28 Z"/>
  </g>

  <!-- ===== figura da frente (embaixo): cabelo curto, braços cruzados ===== -->
  <g transform="translate(256 336) scale(1.05)">
    <path fill="#0a0705" d="M0,-60 C34,-60 50,-38 48,-6 C47,10 44,22 42,32 C40,10 40,-8 30,-20 C20,-32 -20,-32 -30,-20 C-40,-8 -40,10 -42,32 C-44,22 -47,10 -48,-6 C-50,-38 -34,-60 0,-60 Z"/>
    <use href="#head"/>
    <path fill="#0a0705" d="M-38,-26 C-32,-50 -14,-56 0,-54 C14,-56 32,-50 38,-26 C22,-40 -22,-40 -38,-26 Z"/>
  </g>

  <!-- braços cruzados sobre o peito, mãos iluminadas -->
  <g>
    <ellipse cx="234" cy="440" rx="46" ry="13" fill="url(#armg)" transform="rotate(26 234 440)"/>
    <ellipse cx="278" cy="440" rx="46" ry="13" fill="url(#armg)" transform="rotate(-26 278 440)"/>
    <ellipse cx="256" cy="452" rx="20" ry="9" fill="#e8d4bb" opacity="0.5" filter="url(#blur3)"/>
  </g>

  <!-- vinheta: reforça o preto nas quinas -->
  <rect width="512" height="512" fill="none"/>
  <ellipse cx="256" cy="256" rx="300" ry="300" fill="none" stroke="#000" stroke-width="130" opacity="0.55" filter="url(#blur10)"/>
</svg>
